[workspace]
members = ["crates/*", "bin/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Bob Liu <akagi201@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/akjong/longtime"
rust-version = "1.100"

[workspace.dependencies]
axum = "0.8.8"
longtime-core = { path = "crates/core" }
tokio = "1.49.0"
tower-http = "0.6.8"
wasm-bindgen-futures = "0.4.56"

# Core
chrono = "0.4.42"
chrono-tz = "0.10.4"
serde = "1.0.228"

# TUI
clap = "4.5.54"
config = "0.15.19"
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.0"

# Web
base64 = "0.22.1"
console_error_panic_hook = "0.1.7"
gloo-storage = "0.3.0"
gloo-timers = "0.3.0"
leptos = "0.8.15"
serde_json = "1.0.149"
wasm-bindgen = "0.2.106"
web-sys = "0.3.83"

[workspace.lints.rust]
raw_borrows_via_references = "warn"

# Cargo's own lint system (shipped in 1.100): the only unused-dependency
# check. It runs as part of a normal all-targets `cargo check`/`clippy`.
[workspace.lints.cargo]
unused_dependencies = "warn"
